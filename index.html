<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Life">
<meta name="theme-color" content="#0f1115">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<title>MTG Life Tracker</title>
<style>
:root{--bg:#0f1115;--panel:#1a1d24;--text:#f3f4f6;--muted:#9aa0ab;--danger:#ef4444;--accent:#fbbf24}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,system-ui,"Segoe UI",sans-serif;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;touch-action:manipulation;cursor:pointer}
#stage{position:fixed;inset:0}
#app{height:100%;display:flex;flex-direction:column;padding:calc(var(--it,env(safe-area-inset-top)) + var(--dockT,0px)) calc(var(--ir,env(safe-area-inset-right)) + var(--dockR,0px)) calc(var(--ib,env(safe-area-inset-bottom)) + var(--dockB,0px)) calc(var(--il,env(safe-area-inset-left)) + var(--dockL,0px))}
/* When the phone is turned, the board stays fixed to the phone (panels in the same physical spots) while each
   panel's contents are turned back so text and buttons read upright. */
.pc{position:absolute;inset:0}
body.rot .pc{inset:auto;left:50%;top:50%;z-index:5}
body.rot .row.top .panel{transform:none}
body.rot #bar>*{transform:rotate(var(--cr,0deg))}
body.rot #timer{min-width:0!important;padding:0 2px!important;font-size:15px!important}
.row{flex:1;display:flex;min-height:0;gap:3px;padding:3px}
.row.top .panel{transform:rotate(180deg)}
.panel{flex:1;position:relative;border-radius:14px;overflow:hidden;min-width:0;transition:filter .3s}
.panel.hl{filter:brightness(1.3);box-shadow:inset 0 0 0 6px #fff,inset 0 0 40px 10px rgba(255,255,255,.6);z-index:5}
#app.picking .panel:not(.hl):not(.win){filter:brightness(.45)}
.panel.win{filter:brightness(1.15);box-shadow:inset 0 0 0 7px var(--accent),inset 0 0 50px 14px rgba(251,191,36,.7);z-index:5;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:inset 0 0 0 7px #fff,inset 0 0 70px 22px rgba(251,191,36,.9)}}
.cbtn{position:absolute;bottom:46px;right:4px;width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.35);font-size:18px;z-index:3;color:#fff}
.cbtn[hidden]{display:none}
.cmdr-ov{position:absolute;inset:0;z-index:11;background:rgba(15,17,21,.97);display:flex;flex-direction:column;gap:5px;padding:7px;color:#fff;border:1px solid #3a3320;border-radius:14px}
.cmdr-ov .ttl{font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);line-height:1.1}
.cmdr-ov .sub{font-size:11px;color:var(--muted);margin-top:-3px}
.cmdr-ov .rows{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.crow{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;background:#1c2029;border:1px solid #2b303b;border-radius:12px;padding:5px 6px}
.crow .pill{flex:none;min-width:32px;height:24px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800}
.crow .lbl{flex:1 1 70px;min-width:0;font-size:12px;line-height:1.15;overflow-wrap:anywhere}
.crow .stp{flex:none;display:flex;align-items:center;gap:6px;margin-left:auto}
.crow .stp button{width:30px;height:30px;border-radius:50%;background:#2b303b;font-size:18px;font-weight:700;color:#fff}
.crow .stp button.plus{background:var(--accent);color:#000}
.crow .cnt{min-width:24px;text-align:center;line-height:1}
.crow .val{display:block;font-size:18px;font-weight:800}
.crow .of{display:block;font-size:8px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;margin-top:1px}
.crow.lethal{border-color:var(--danger)}.crow.lethal .val{color:var(--danger)}
.cmdr-ov .done{flex:none;height:38px;border-radius:12px;background:var(--accent);color:#000;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.cmdr-ov.full{position:fixed;z-index:60;border:0;border-radius:0;gap:10px;align-items:stretch;padding:calc(env(safe-area-inset-top) + 16px) calc(env(safe-area-inset-right) + 16px) calc(env(safe-area-inset-bottom) + 16px) calc(env(safe-area-inset-left) + 16px)}
.cmdr-ov.full>*{width:100%;max-width:560px;margin-left:auto;margin-right:auto}
.cmdr-ov.full .ttl{font-size:20px}
.cmdr-ov.full .sub{font-size:14px;margin-top:-4px}
.cmdr-ov.full .rows{gap:8px}
.cmdr-ov.full .crow{padding:8px 10px;border-radius:14px;gap:6px 10px}
.cmdr-ov.full .pill{min-width:42px;height:30px;border-radius:15px;font-size:14px}
.cmdr-ov.full .lbl{font-size:16px;flex-basis:110px}
.cmdr-ov.full .stp{gap:10px}
.cmdr-ov.full .stp button{width:42px;height:42px;font-size:24px}
.cmdr-ov.full .cnt{min-width:38px}
.cmdr-ov.full .val{font-size:26px}
.cmdr-ov.full .of{font-size:10px}
.cmdr-ov.full .done{height:48px;font-size:17px;border-radius:14px}
.sparkles{position:absolute;inset:0;pointer-events:none;z-index:6;overflow:hidden}
.sparkles span{position:absolute;color:#fff;text-shadow:0 0 6px #fde68a,0 0 14px var(--accent);opacity:0;animation:twinkle 1s ease-in-out infinite}
@keyframes twinkle{0%{opacity:0;transform:scale(.2) rotate(0)}50%{opacity:1;transform:scale(1) rotate(90deg)}100%{opacity:0;transform:scale(.2) rotate(180deg)}}
.sparkles .first{position:absolute;left:0;right:0;top:34px;text-align:center;font-size:22px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:1;animation:none;color:#fff}
#pickguard{position:fixed;inset:0;z-index:15;display:none}
.panel.charging .life span{animation:charge 1s linear forwards}
@keyframes charge{to{transform:scale(1.14);text-shadow:0 0 18px #fff,0 0 36px var(--accent)}}
.exact{position:absolute;inset:0;z-index:11;background:rgba(15,17,21,.97);display:flex;flex-direction:column;align-items:stretch;gap:8px;padding:10px;color:#fff}
.exact .hintline{text-align:center;font-size:12px;color:var(--muted)}
.exact input{width:100%;background:#262a33;border:2px solid var(--accent);border-radius:12px;color:#fff;font:inherit;font-weight:800;font-size:min(14vw,9vh);text-align:center;padding:6px 8px;outline:none;-webkit-user-select:text;user-select:text;font-variant-numeric:tabular-nums}
.exact .acts{display:flex;gap:8px}
.exact .acts button{flex:1;height:44px;border-radius:10px;background:#262a33;font-size:16px;font-weight:700}
.exact .acts .neg{flex:0 0 52px}
.exact .acts .set{background:var(--accent);color:#000}
.panel.dead::after{content:"";position:absolute;inset:0;z-index:4;pointer-events:none;background:rgba(0,0,0,.35);-webkit-backdrop-filter:grayscale(.9) brightness(.55);backdrop-filter:grayscale(.9) brightness(.55)}
.panel.champ{filter:brightness(1.15);box-shadow:inset 0 0 0 7px var(--accent),inset 0 0 50px 14px rgba(251,191,36,.7);z-index:5;animation:pulse 1s ease-in-out infinite}
.sparkles .first.xl{pointer-events:auto;cursor:pointer;font-size:min(9vw,7vh);top:auto;bottom:12%;color:#fde68a;text-shadow:0 0 10px #000,0 0 18px var(--accent)}
.panel .name{position:absolute;top:8px;left:0;right:0;text-align:center;font-size:14px;font-weight:600;opacity:.85;z-index:2;pointer-events:none}
.panel .name.editable{pointer-events:auto;cursor:text;top:2px;padding:6px 0 14px}
.panel .name.editable::after{content:" ✎";opacity:.8}
.nameedit{position:absolute;top:6px;left:10px;right:10px;z-index:12;background:rgba(15,17,21,.95);border:2px solid var(--accent);border-radius:10px;color:#fff;font:inherit;font-weight:700;font-size:18px;text-align:center;padding:6px 8px;outline:none;-webkit-user-select:text;user-select:text}
.panel .life{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:min(22vw,22vh);font-weight:800;font-variant-numeric:tabular-nums;pointer-events:none;text-shadow:0 2px 12px rgba(0,0,0,.35)}
.panel.n5 .life,.panel.n6 .life{font-size:min(16vw,15vh)}
.panel.n3 .life,.panel.n4 .life{font-size:min(18vw,18vh)}
.half{position:absolute;top:0;bottom:0;width:50%;z-index:1;touch-action:manipulation}
.half.minus{left:0}.half.plus{right:0}
.half:active{background:rgba(255,255,255,.08)}
.half span{position:absolute;top:50%;transform:translateY(-50%);font-size:34px;opacity:.35;pointer-events:none}
.minus span{left:14px}.plus span{right:14px}
.delta{position:absolute;left:0;right:0;top:calc(50% + min(12vw,12vh) + 4px);text-align:center;font-size:20px;font-weight:700;opacity:0;transition:opacity .4s;pointer-events:none;z-index:2}
.delta.show{opacity:.95}
.cdmg{position:absolute;bottom:4px;left:6px;right:50px;display:flex;gap:6px;flex-wrap:wrap;z-index:3}
.chip,.badge,.gear{color:#fff}
.sw{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sw button{width:36px;height:36px;border-radius:50%;border:3px solid transparent}
.sw button.on{border-color:#fff}
.sw button.taken{position:relative;opacity:.45;cursor:not-allowed}
.sw button.taken::after{content:"✕";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:#fff;text-shadow:0 0 3px #000,0 0 3px #000}
.sw .note{flex-basis:100%;font-size:12px;color:var(--muted);min-height:16px}
.sw input{width:44px;height:36px;border:0;background:none;padding:0}
.chip{display:flex;align-items:center;gap:5px;height:38px;padding:0 10px;border-radius:999px;background:rgba(0,0,0,.5);font-weight:700;font-size:16px;font-variant-numeric:tabular-nums;touch-action:manipulation}
.chip i{width:12px;height:12px;border-radius:50%;display:block;border:2px solid rgba(255,255,255,.8)}
.chip:active{background:rgba(0,0,0,.75)}.chip.lethal{background:var(--danger)}
.chip small{opacity:.7;font-size:11px;font-weight:500}
.badges{position:absolute;bottom:50px;left:8px;right:44px;display:flex;gap:6px;flex-wrap:wrap;z-index:2;pointer-events:none}
.badge{background:rgba(0,0,0,.4);border-radius:999px;padding:2px 8px;font-size:13px;font-weight:600;white-space:nowrap}
button.badge.tap{pointer-events:auto;color:#fff;border:0;padding:7px 12px;font-size:15px;touch-action:manipulation;cursor:pointer}
button.badge.tap:active{background:rgba(0,0,0,.7)}
.badge.crown{background:var(--accent);color:#000}
.crownbtn{position:absolute;top:6px;width:46px;height:46px;border-radius:50%;background:rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;font-size:30px;line-height:1;z-index:3;cursor:grab;touch-action:none;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}
.crownbtn[hidden]{display:none}
.panel[data-crown=left] .crownbtn{left:6px}.panel[data-crown=right] .crownbtn{right:6px}
.crownbtn.lifted{opacity:.35}
.tokcol{position:absolute;top:6px;display:flex;flex-direction:column;gap:6px;z-index:3;pointer-events:none}
.panel[data-crown=left] .tokcol{right:6px}.panel[data-crown=right] .tokcol{left:6px}
.tok.drag{pointer-events:auto;cursor:grab;touch-action:none}
.tok.lifted{opacity:.35}
.tok{width:46px;height:46px;border-radius:50%;background:rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;font-size:28px;line-height:1;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}
.monarch-ghost{position:fixed;z-index:70;pointer-events:none;transform:translate(-50%,-50%) scale(1.2);font-size:46px;line-height:1;filter:drop-shadow(0 6px 10px rgba(0,0,0,.6))}
.panel.drop{box-shadow:inset 0 0 0 6px var(--accent),inset 0 0 40px 10px rgba(251,191,36,.55);z-index:5}
.gear{position:absolute;bottom:4px;right:4px;width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.35);font-size:18px;z-index:3}
.status{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0 10px;text-align:center;z-index:5;pointer-events:none}
.status .icon{font-size:min(30vw,26vh);line-height:1;filter:drop-shadow(0 4px 10px rgba(0,0,0,.6))}
.panel.n5 .status .icon,.panel.n6 .status .icon{font-size:min(22vw,18vh)}
.status .why{font-size:min(7vw,5.5vh);font-weight:800;letter-spacing:.04em;text-shadow:0 2px 8px rgba(0,0,0,.8);color:#fff}
.status .icon+.why{font-size:min(5vw,4vh);text-transform:uppercase;letter-spacing:.14em}
.panel.dead .status{display:flex}.panel.dead .life{opacity:.25}

/* center bar */
#bar{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);touch-action:none;z-index:20;display:flex;align-items:center;gap:4px;background:rgba(15,17,21,.92);border:1px solid #333;border-radius:999px;padding:4px 6px;box-shadow:0 4px 20px rgba(0,0,0,.5)}
#bar button{width:40px;height:42px;border-radius:50%;font-size:20px}
#bar button:disabled{opacity:.3;cursor:default}
#bar button:disabled:active{background:none}
#bar button:active{background:#333}
#bar.snap{transition:left .2s ease,top .2s ease}
#bar.drag{opacity:.85}
#bar[data-pos=start],#bar[data-pos=end]{transform:none;border-radius:0;border-width:0;justify-content:center}
#bar[data-pos=start][data-o=h],#bar[data-pos=end][data-o=h]{left:0;right:0;height:56px;gap:14px;padding:0 8px}
#bar[data-pos=start][data-o=h]{top:var(--it,env(safe-area-inset-top));border-bottom:1px solid #333}
#bar[data-pos=end][data-o=h]{top:auto;bottom:var(--ib,env(safe-area-inset-bottom));border-top:1px solid #333}
#bar[data-pos=start][data-o=v],#bar[data-pos=end][data-o=v]{top:0;bottom:0;width:60px;flex-direction:column;gap:10px;padding:8px 0}
#bar[data-pos=start][data-o=v]{left:var(--il,env(safe-area-inset-left));right:auto;border-right:1px solid #333}
#bar[data-pos=end][data-o=v]{left:auto;right:var(--ir,env(safe-area-inset-right));border-left:1px solid #333}
#bar[data-pos=start][data-o=h] #timer,#bar[data-pos=end][data-o=h] #timer{font-size:18px;min-width:90px}
#bar[data-o=v][data-pos=start] #timer,#bar[data-o=v][data-pos=end] #timer{min-width:0;padding:4px 0;font-size:13px}
#bar[data-o=v][data-pos=start] #grip,#bar[data-o=v][data-pos=end] #grip{width:42px;height:22px}
#bar[data-o=v][data-pos=start] #grip span,#bar[data-o=v][data-pos=end] #grip span{display:block;transform:rotate(90deg)}
#bar.drag{left:auto;right:auto;bottom:auto;width:auto!important;flex-direction:row!important;transform:translate(-50%,-50%)!important;border-radius:999px!important;height:auto!important;padding:4px 6px!important;border-width:1px!important;box-shadow:0 8px 28px rgba(0,0,0,.7)}
#grip{width:22px;height:42px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:18px;cursor:grab;touch-action:none;letter-spacing:-2px}
#timer{touch-action:none;font-variant-numeric:tabular-nums;font-size:15px;font-weight:600;padding:0 8px;min-width:64px;text-align:center;color:var(--muted)}

/* sheets */
.sheet{position:absolute;inset:0;background:rgba(15,17,21,.97);z-index:10;overflow-y:auto;padding:12px;color:var(--text)}
.sheet h3{margin:14px 0 6px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sheet .head{display:flex;align-items:center;gap:8px}
.sheet .head input{flex:1;background:#262a33;border:0;border-radius:8px;color:inherit;font:inherit;font-weight:700;font-size:17px;padding:8px 10px;-webkit-user-select:text;user-select:text;min-width:0}
.close{width:38px;height:38px;border-radius:50%;background:#262a33;font-size:18px}
.ctr{display:flex;align-items:center;justify-content:space-between;background:#20242c;border-radius:10px;padding:6px 8px;margin-bottom:6px}
.ctr .lbl{font-size:15px}.ctr .lbl small{display:block;color:var(--muted);font-size:11px}
.ctr .stepper{display:flex;align-items:center;gap:10px}
.ctr .stepper button{width:40px;height:40px;border-radius:10px;background:#333945;font-size:22px;font-weight:700}
.ctr .val{min-width:34px;text-align:center;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.panel .name small{display:block;font-weight:500;font-size:11px;opacity:.8}
.arts{position:absolute;inset:0;display:flex;flex-direction:column;pointer-events:none}
.arts img{flex:1;min-height:0;width:100%;object-fit:contain}
.arts img:first-child{object-position:center top}.arts img:last-child{object-position:center bottom}
.arts::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.25),rgba(0,0,0,.55))}
.arts.one{inset:6px;border-radius:10px;overflow:hidden;background-size:cover;background-position:center}
.cmd-search{width:100%;background:#262a33;border:0;border-radius:8px;color:inherit;font:inherit;padding:10px;-webkit-user-select:text;user-select:text}
.cmd-res{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.cmd-res button{display:flex;align-items:center;gap:8px;text-align:left;background:#20242c;border-radius:8px;padding:4px;font-size:13px}
.cmd-res img{width:56px;height:41px;object-fit:cover;border-radius:4px;flex:none}
.cmd-cur{display:flex;align-items:center;gap:8px;background:#20242c;border-radius:8px;padding:4px;font-size:13px;margin-bottom:6px}
.cmd-cur img{width:56px;height:41px;object-fit:cover;border-radius:4px}
.cmd-cur button{margin-left:auto;background:#333945;border-radius:8px;padding:8px 10px;font-size:13px}
.ctr .lbl{font-size:13px;min-width:0;flex:1}
.ctr .stepper{gap:4px;flex:none}
.ctr .stepper button{width:34px;height:34px;font-size:20px}
.ctr .val{min-width:26px;font-size:19px}
.sheet{padding:10px 8px 60px}
.sheet.full{position:fixed;z-index:60;background:rgba(15,17,21,.98);padding:calc(env(safe-area-inset-top) + 14px) calc(env(safe-area-inset-right) + 14px) calc(env(safe-area-inset-bottom) + 24px) calc(env(safe-area-inset-left) + 14px)}
.sheet.full>*{max-width:560px;margin-left:auto;margin-right:auto}
.sheet.full h3{font-size:14px;margin-top:18px;margin-bottom:8px}
.sheet.full .head input{font-size:20px;padding:10px 12px}
.sheet.full .close{width:44px;height:44px;flex:none}
.sheet.full .ctr{padding:8px 10px;margin-bottom:8px;border-radius:12px}
.sheet.full .ctr .lbl{font-size:16px}
.sheet.full .ctr .stepper{gap:10px}
.sheet.full .ctr .stepper button{width:44px;height:44px;font-size:24px}
.sheet.full .ctr .val{font-size:24px;min-width:36px}
.sheet.full .sw button{width:40px;height:40px}
.sheet.full .toggles button{padding:14px 8px;font-size:15px}
.sheet.full .log{font-size:15px}
.sheet.full .cmd-search{font-size:16px;padding:12px}
.sheet.full .sdone{display:block;width:100%;height:50px;margin-top:22px;border-radius:14px;background:var(--accent);color:#000;font-weight:800;font-size:17px;letter-spacing:.06em;text-transform:uppercase}
.ctr.lethal{outline:2px solid var(--danger)}.ctr.lethal .val{color:var(--danger)}
.toggles{display:flex;flex-wrap:wrap;gap:8px}
.toggles button{flex:1 1 40%;padding:12px 8px;border-radius:10px;background:#20242c;font-weight:600}
.toggles button.on{background:var(--accent);color:#000}
.log{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.log div{display:flex;justify-content:space-between;padding:4px 2px;border-bottom:1px solid #262a33}
.log b{color:var(--text)}.log .pos b{color:#4ade80}.log .neg b{color:#f87171}

/* modal (unrotated) */
#modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;padding:16px}
#modal.open{display:flex}
#modal .card{background:#1a1d24;border-radius:18px;padding:18px;width:100%;max-width:420px;max-height:90vh;overflow-y:auto}
#modal .card.bare{background:none;padding:0;max-width:420px;max-height:none;overflow:visible;display:flex;flex-direction:column;align-items:center;gap:10px}
#modal .card.bare img{display:block;border-radius:14px;background:#0f1115;max-width:100%}
#modal .card.bare .btns{display:flex;gap:10px;width:100%}
#modal .card.bare .btns button{flex:1;height:46px;border-radius:12px;background:#262a33;font-size:16px;font-weight:700}
#modal .card.bare .btns .share{background:var(--accent);color:#000}
#modal .card.bare .btns button:disabled{opacity:.5}
#modal h2{margin:0 0 12px;font-size:20px}
#modal h3{margin:16px 0 8px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid button,.big{padding:14px 6px;border-radius:12px;background:#262a33;font-weight:700;font-size:16px}
.grid button.on{background:var(--accent);color:#000}
.big{width:100%;display:block}
.result{margin-top:10px;text-align:center;font-size:48px;font-weight:800;min-height:62px}
.result small{display:block;font-size:13px;color:var(--muted);font-weight:500}
.danger{background:#7f1d1d!important}
.hint{color:var(--muted);font-size:13px;margin:6px 0 0}
@keyframes spin{from{transform:rotateX(0)}to{transform:rotateX(720deg)}}
.flip{animation:spin .8s ease-out}
</style>

<body>
<div id="stage"><div id="app"><div class="row top" id="rowTop"></div><div class="row" id="rowBot"></div></div>
<div id="bar" data-pos="center">
  <div id="grip" title="Drag to move"><span>⋮⋮</span></div>
  <button id="bMenu" title="New game / settings">⚙️</button>
  <button id="bTools" title="Dice &amp; coin">🎲</button>
  <button id="bUndo" title="Undo" disabled>↶</button>
  <button id="bRedo" title="Redo" disabled>↷</button>
  <button id="bGraph" title="Game summary graph" hidden>📊</button>
  <div id="timer">0:00</div>
  <button id="bPause" title="Pause timer">⏸</button>
</div>
</div>
<div id="pickguard"></div>
<div id="modal"><div class="card" id="card"></div></div>

<script>
// Bump on every release so the version shown in Settings tells you which build your phone is running.
const APP_VERSION='1.1.5',APP_BUILD='2026-10-04';
const versionLine=()=>`MTG Life Tracker v${APP_VERSION} · build ${APP_BUILD}`;
const COLORS=['#b91c1c','#1d4ed8','#15803d','#e5e7eb','#7e22ce','#0e7490'];   // player 4 is white
const SWATCHES=['#b91c1c','#ea580c','#a16207','#ca8a04','#15803d','#0e7490','#1d4ed8','#7e22ce','#be185d','#475569','#111827','#e5e7eb'];
const colorOf=j=>S.players[j].color||COLORS[j];
const takenBy=(c,i)=>S.players.findIndex((o,j)=>j!==i&&colorOf(j).toLowerCase()===c.toLowerCase());
const isLight=c=>{const n=parseInt(c.slice(1),16);return (0.299*(n>>16)+0.587*(n>>8&255)+0.114*(n&255))/255>0.65};
const MODES={standard:{label:'Standard',life:20,cmdr:false},commander:{label:'Commander',life:40,cmdr:true},brawl:{label:'Brawl',life:25,cmdr:true}};
const KEY='mtg-life-v1';
let S=load();
function fresh(n,mode){
  const m=MODES[mode];
  return{n,mode,start:m.life,elapsed:0,paused:false,monarch:null,initiative:null,
    players:Array.from({length:n},(_,i)=>({name:'Player '+(i+1),life:m.life,poison:0,energy:0,exp:0,cmdr:Array(n).fill(0),cmdrB:Array(n).fill(0),cmds:[],log:[]}))};
}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.players){
    s.players.forEach(p=>{if(!p.cmds)p.cmds=p.cmdrName?[{name:p.cmdrName,art:p.art,artist:p.artist||''}]:[];if(!p.cmdrB)p.cmdrB=Array(s.players.length).fill(0)});return s}}catch(e){}return fresh(4,'commander')}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const $=id=>document.getElementById(id);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=s=>{const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return(h?h+':'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0')};
const buzz=()=>{try{navigator.vibrate&&navigator.vibrate(8)}catch(e){}};

const panels=[];
const pcOf=P=>P.querySelector(':scope>.pc')||P;
let ROT=0;   // degrees the board is turned so it stays fixed to the phone (0 when upright)
const ro=typeof ResizeObserver==='function'?new ResizeObserver(es=>es.forEach(e=>layoutPC(e.target))):null;
function render(){
  ro&&ro.disconnect();
  $('rowTop').innerHTML='';$('rowBot').innerHTML='';panels.length=0;
  const n=S.players.length,topN=Math.floor(n/2);
  S.players.forEach((p,i)=>{
    const P=el('div','panel n'+n);P.style.background=colorOf(i);
    P.append(el('div','name'),el('div','life','<span></span>'),el('div','delta'),el('div','badges'),el('div','cdmg'),el('div','status'));
    // inner corner: top-row panels are turned 180deg, so their screen-side maps to the opposite local side
    {
      const inTop=i<topN,m=inTop?topN:n-topN,k=inTop?i:i-topN;
      const screenSide=k<(m-1)/2?'right':k>(m-1)/2?'left':'right';   // the side facing the middle of the table
      P.dataset.crown=inTop?(screenSide==='right'?'left':'right'):screenSide;P.dataset.crownN=P.dataset.crown;
      const cr=el('div','crownbtn','👑');cr.title='Monarch - drag to another player';cr.hidden=true;
      cr.addEventListener('pointerdown',e=>{if(S.monarch===i)startTokenDrag(e,i,cr,'monarch','👑')});
      P.append(cr);
      P.append(el('div','tokcol'));
    }
    P.querySelector('.name').onclick=()=>{if(P.querySelector('.name').classList.contains('editable'))startNameEdit(i)};
    const mk=(dir)=>{
      const h=el('div','half '+(dir>0?'plus':'minus'),'<span>'+(dir>0?'+':'−')+'</span>');
      let t,iv,held,down=false;
      const stop=()=>{clearTimeout(t);clearInterval(iv);P.classList.remove('charging')};
      h.addEventListener('pointerdown',e=>{e.preventDefault();held=false;down=true;
        const r=P.querySelector('.life span').getBoundingClientRect(),pad=14;
        const onNum=e.clientX>=r.left-pad&&e.clientX<=r.right+pad&&e.clientY>=r.top-pad&&e.clientY<=r.bottom+pad;
        if(onNum){  // press and hold directly on the life total (1s) -> type an exact value
          P.classList.add('charging');
          t=setTimeout(()=>{held=true;P.classList.remove('charging');buzz();openExact(i)},1000);
        }else t=setTimeout(()=>{held=true;adjust(i,dir*5);iv=setInterval(()=>adjust(i,dir*5),450)},500)});
      h.addEventListener('pointerup',()=>{const was=down;down=false;stop();if(was&&!held)adjust(i,dir);tryFocusExact()});
      h.addEventListener('touchend',tryFocusExact);
      const abort=()=>{down=false;stop()};h.addEventListener('pointerleave',abort);h.addEventListener('pointercancel',abort);
      h.addEventListener('contextmenu',e=>e.preventDefault());
      return h;
    };
    P.append(mk(-1),mk(1));
    const g=el('button','gear','☰');g.onclick=()=>openSheet(i);P.append(g);
    const cb=el('button','cbtn','⚔️');cb.title='Commander damage';cb.onclick=()=>openCmdr(i);P.append(cb);
    const pc=el('div','pc');while(P.firstChild)pc.append(P.firstChild);P.append(pc);
    P.dataset.top=i<topN?'1':'0';
    (i<topN?$('rowTop'):$('rowBot')).append(P);panels.push({P,delta:0,dt:null});
    ro&&ro.observe(P);
  });
  if(!topN)$('rowTop').style.display='none';else $('rowTop').style.display='';
  // rows share the height in proportion to their panel count, so every panel ends up with about the same area (3 and 5 players)
  $('rowTop').style.flexGrow=topN;$('rowBot').style.flexGrow=n-topN;
  update();
  panels.forEach(x=>layoutPC(x.P));
}
/* why a player is out: commander damage > poison > life; a recorded cause is kept while it still applies */
function defeatCauses(p,i){
  const c=[];
  S.players.forEach((o,j)=>{
    if(p.cmdr[j]>=21)c.push({key:`c${j}a`,type:'cmdr',by:(o.cmds[0]&&o.cmds[0].name)||o.name});
    if(p.cmdrB[j]>=21)c.push({key:`c${j}b`,type:'cmdr',by:(o.cmds[1]&&o.cmds[1].name)||o.name});
  });
  if(p.poison>=10)c.push({key:'poison',type:'poison'});
  if(p.life<=0)c.push({key:'life',type:'life'});
  return c;
}
let gameIsOver=false;
function dead(p){return p.life<=0||p.poison>=10||p.cmdr.some(v=>v>=21)||p.cmdrB.some(v=>v>=21)}
function update(){
  S.players.forEach((p,i)=>{
    const {P}=panels[i];
    const nm=P.querySelector('.name');nm.textContent=p.name;
    P.querySelector('.cbtn').hidden=!MODES[S.mode].cmdr;   // commander damage shortcut: Commander/Brawl only
    nm.classList.toggle('editable',p.name==='Player '+(i+1));  // still the default: tap the name to rename it right here
    if(p.cmds.length){const sm=el('small');sm.textContent=p.cmds.map(c=>c.name).join(' & ')+' · art: '+[...new Set(p.cmds.map(c=>c.artist).filter(Boolean))].join(', ');nm.append(sm)}
    P.classList.toggle('art',p.cmds.length>0);
    let ar=P.querySelector('.arts');
    const key=p.cmds.map(c=>c.art).join('|');
    if(ar&&ar.dataset.k!==key){ar.remove();ar=null}
    if(p.cmds.length&&!ar){
      ar=el('div','arts'+(p.cmds.length==1?' one':''));ar.dataset.k=key;
      if(p.cmds.length==1)ar.style.backgroundImage=`url("${p.cmds[0].art}")`;
      else p.cmds.forEach(c=>{const im=el('img');im.alt='';im.src=c.art;ar.append(im)});
      pcOf(P).prepend(ar)}
    P.style.background=colorOf(i);P.style.color=isLight(colorOf(i))?'#111':'#fff';
    P.querySelector('.life span').textContent=p.life;
    P.classList.toggle('dead',dead(p));
    const isDead=dead(p),aliveCount=S.players.filter(q=>!dead(q)).length;
    if(isDead){
      const cs=defeatCauses(p,i),cur=cs.find(c=>p.defeat&&c.key===p.defeat.key)||cs[0];
      if(!p.defeat||p.defeat.key!==cur.key||p.defeat.by!==cur.by)p.defeat=cur;
      if(p.defeatT==null)p.defeatT=S.elapsed;   // when they were eliminated (game clock, seconds)
    }else{delete p.defeat;p.defeatT=null}
    const st=P.querySelector('.status'),d=p.defeat;
    st.innerHTML=!d?'':d.type==='life'?'<div class="icon">☠️</div><div class="why">Defeated</div>'
      :d.type==='poison'?'<div class="icon">🧪</div><div class="why">Poisoned</div>'
      :`<div class="why">Defeated by ${esc(d.by)}!</div>`;
    const champ=!isDead&&aliveCount===1&&S.players.length>1;
    P.classList.toggle('champ',champ);
    let cs2=P.querySelector('.sparkles.champ-sp');
    if(champ&&!cs2){const sp=makeSparkles('Winner! 📊','champ-sp',true);sp.querySelector('.first').onclick=openSummary;pcOf(P).append(sp)}
    else if(!champ&&cs2)cs2.remove();
    const cd=P.querySelector('.cdmg');cd.innerHTML='';
    if(MODES[S.mode].cmdr)S.players.forEach((o,j)=>{
      [['c',p.cmdr,0],...(o.cmds.length>1?[['d',p.cmdrB,1]]:[])].forEach(([pre,arr,k])=>{
        if(!arr[j])return;  // hidden until this commander has dealt damage (add the first point from the ☰ menu)
        const c=el('button','chip'+(arr[j]>=21?' lethal':''),`<i style="background:${colorOf(j)}"></i><span>${arr[j]}</span>`+(o.cmds.length>1?`<small>${k?'B':'A'}</small>`:'')+(j===i?'<small>you</small>':''));
        c.title='Commander damage from '+(o.cmds[k]?o.cmds[k].name:o.name);
        let t,held=false;
        c.addEventListener('pointerdown',e=>{e.stopPropagation();held=false;t=setTimeout(()=>{held=true;cmdrAdjust(i,pre+j,-1)},500)});
        c.addEventListener('pointerup',e=>{e.stopPropagation();clearTimeout(t);if(!held)cmdrAdjust(i,pre+j,1)});
        c.addEventListener('pointerleave',()=>clearTimeout(t));c.addEventListener('pointercancel',()=>clearTimeout(t));
        c.addEventListener('contextmenu',e=>e.preventDefault());
        cd.append(c);
      })});
    const b=P.querySelector('.badges');b.innerHTML='';
    P.querySelector('.crownbtn').hidden=S.monarch!==i;
    const tc=P.querySelector('.tokcol');tc.innerHTML='';   // Initiative / City's Blessing: icons stacked in the corner opposite the crown
    [[S.initiative===i,'🏰','Initiative'],[!!p.blessing,'🏙️','City’s Blessing']].forEach(([on,icon,title])=>{
      if(!on)return;const t=el('div','tok',icon);t.title=title;
      if(title==='Initiative'){t.classList.add('drag');t.title='Initiative - drag to another player';t.addEventListener('pointerdown',e=>{if(S.initiative===i)startTokenDrag(e,i,t,'initiative','🏰')})}
      tc.append(t);
    });
    // once a counter has started, tapping its badge adds one (lowering it is done from the player's menu)
    [['poison','☠'],['energy','⚡'],['exp','✨']].forEach(([k,icon])=>{
      if(!p[k])return;
      const t=el('button','badge tap',icon+' '+p[k]);t.title='Tap to add one';
      t.onclick=()=>{record(k+i);p[k]++;buzz();update()};
      b.append(t);
    });
    
  });
  // game over (one or no players left): show the summary once. First update after load/new game only records the state.
  const over=S.players.length>1&&S.players.filter(q=>!dead(q)).length<=1;
  gameIsOver=over;$('bGraph').hidden=!over;   // graph icon appears in the bar once the game has ended
  save();
}
/* undo / redo: snapshots of the game numbers (life, counters, commander damage, tokens, log). Rapid repeated changes
   to the same thing within 1.5s are one step, so a burst of taps undoes together. */
const undoStack=[],redoStack=[];let lastKey=null,lastT=0;
const snap=()=>JSON.stringify({pl:S.players.map(p=>({life:p.life,poison:p.poison,energy:p.energy,exp:p.exp,blessing:!!p.blessing,defeatT:p.defeatT??null,cmdr:p.cmdr,cmdrB:p.cmdrB,log:p.log})),monarch:S.monarch,initiative:S.initiative});
function record(key){
  const now=Date.now();
  if(key===lastKey&&now-lastT<1500){lastT=now;return}
  undoStack.push(snap());if(undoStack.length>100)undoStack.shift();
  redoStack.length=0;lastKey=key;lastT=now;syncHistoryButtons();
}
function clearHistory(){undoStack.length=0;redoStack.length=0;lastKey=null;syncHistoryButtons()}
function syncHistoryButtons(){$('bUndo').disabled=!undoStack.length;$('bRedo').disabled=!redoStack.length}
function restore(str){
  const d=JSON.parse(str);
  d.pl.forEach((q,i)=>Object.assign(S.players[i],q));S.monarch=d.monarch;S.initiative=d.initiative;
  panels.forEach(x=>{clearTimeout(x.dt);x.delta=0;x.P.querySelector('.delta').classList.remove('show')});
  lastKey=null;update();
  if(sheetFor!=null)openSheet(sheetFor);
  if(cmdrFor!=null)openCmdr(cmdrFor);
  syncHistoryButtons();buzz();
}
function undo(){if(!undoStack.length)return;redoStack.push(snap());restore(undoStack.pop())}
function redo(){if(!redoStack.length)return;undoStack.push(snap());restore(redoStack.pop())}

/* exact life entry: opens the phone keyboard on an input inside the panel (iOS's number pad has no minus key, so there is a +/- button) */
function openExact(i){
  const p=S.players[i],P=panels[i].P;P.querySelector('.exact')?.remove();
  const ex=el('div','exact');
  ex.innerHTML=`<div class="hintline">Set exact life total</div><input type="text" inputmode="numeric" pattern="-?[0-9]*" maxlength="5" autocomplete="off" aria-label="Exact life total"><div class="acts"><button class="neg" title="Toggle negative">±</button><button class="cancel">Cancel</button><button class="set">Set</button></div>`;
  const inp=ex.querySelector('input');inp.value=p.life;
  const clean=()=>{inp.value=inp.value.replace(/(?!^)-/g,'').replace(/[^0-9-]/g,'')};
  inp.oninput=clean;
  ex.querySelector('.neg').onclick=()=>{inp.value=inp.value.startsWith('-')?inp.value.slice(1):'-'+inp.value;inp.focus()};
  const done=apply=>{
    const v=parseInt(inp.value,10);
    if(apply&&!isNaN(v)&&v!==p.life){record('exact'+Date.now());const d=v-p.life;p.life=v;logEvent(p,'life set',d,v);buzz();update()}
    inp.blur();ex.remove();
  };
  ex.querySelector('.cancel').onclick=()=>done(false);
  ex.querySelector('.set').onclick=()=>done(true);
  inp.onkeydown=e=>{if(e.key==='Enter')done(true);else if(e.key==='Escape')done(false)};
  pcOf(P).append(ex);
  // iOS only raises the keyboard when focus() runs inside a touch gesture; the long press has already ended its
  // gesture by now, so focus again when the finger lifts (see tryFocusExact), and fall back to a hint + tapping the box.
  const touch=matchMedia('(pointer: coarse)').matches;
  if(!touch)inp.focus();  // desktop/Android focus immediately; on touch screens wait for the finger to lift
  else ex.querySelector('.hintline').textContent='Set exact life total · tap the box if the keyboard is hidden';
  pendingExact=inp;setTimeout(()=>{if(pendingExact===inp)pendingExact=null},3000);
}
let pendingExact=null;
function tryFocusExact(){
  const x=pendingExact;if(!x)return;
  x.focus();try{x.setSelectionRange(0,x.value.length)}catch(e){}
  if(document.activeElement===x)pendingExact=null;
}
/* tap the default "Player #" name on the panel to rename it; once renamed, rename from the player's menu as before */
function startNameEdit(i){
  const P=panels[i].P,p=S.players[i],def='Player '+(i+1);
  if(P.querySelector('.nameedit'))return;
  const inp=el('input','nameedit');inp.type='text';inp.maxLength=16;inp.placeholder=def;inp.autocomplete='off';inp.setAttribute('aria-label','Player name');
  let finished=false;
  const finish=apply=>{
    if(finished)return;finished=true;
    const v=inp.value.trim();if(apply&&v)p.name=v;
    inp.remove();update();
  };
  inp.onkeydown=e=>{if(e.key==='Enter')finish(true);else if(e.key==='Escape')finish(false)};
  inp.onblur=()=>finish(true);
  pcOf(P).append(inp);inp.focus();
}
/* quick commander-damage overlay: full screen, one player at a time (turned to face top-row players) */
let cmdrFor=null;
function closeCmdr(){document.querySelector('.cmdr-ov')?.remove();cmdrFor=null}
function openCmdr(i){
  closeCmdr();cmdrFor=i;
  const p=S.players[i],ov=el('div','cmdr-ov full');
  if(faceAngle(i)===180)ov.style.transform='rotate(180deg)';   // players facing the top edge
  ov.innerHTML='<div class="ttl">Commander damage</div><div class="sub"></div><div class="rows"></div><button class="done">Done</button>';
  ov.querySelector('.sub').textContent='Damage taken by '+p.name;
  const rows=ov.querySelector('.rows');
  const draw=()=>{
    rows.innerHTML='';
    S.players.forEach((o,j)=>{
      for(let k=0;k<Math.max(1,o.cmds.length);k++){
        const key=(k?'d':'c')+j,val=(k?p.cmdrB:p.cmdr)[j];
        const row=el('div','crow'+(val>=21?' lethal':''));
        const col=colorOf(j);
        row.innerHTML='<div class="pill"></div><div class="lbl"></div><div class="stp"><button class="minus">−</button><div class="cnt"><span class="val"></span><span class="of">of 21</span></div><button class="plus">+</button></div>';
        const pill=row.querySelector('.pill');pill.textContent='P'+(j+1);pill.style.background=col;pill.style.color=isLight(col)?'#111':'#fff';
        row.querySelector('.lbl').textContent='From '+(j===i?'my own ':'')+(o.cmds[k]?o.cmds[k].name:o.name);
        row.querySelector('.val').textContent=val;
        row.querySelector('.minus').onclick=()=>{if(cmdrAdjust(i,key,-1))draw()};
        row.querySelector('.plus').onclick=()=>{cmdrAdjust(i,key,1);draw()};
        rows.append(row);
      }
    });
  };
  draw();
  ov.querySelector('.done').onclick=closeCmdr;
  document.body.append(ov);
}
/* drag a single-holder token (Monarch crown, Initiative) onto another player's panel to pass it on */
function startTokenDrag(e,from,badge,key,icon){
  e.preventDefault();
  const ghost=el('div','monarch-ghost',icon);document.body.append(ghost);badge.classList.add('lifted');
  let target=-1;
  const place=ev=>{
    ghost.style.left=ev.clientX+'px';ghost.style.top=ev.clientY+'px';
    const hit=document.elementsFromPoint(ev.clientX,ev.clientY).find(n=>n.classList&&n.classList.contains('panel'));
    const idx=hit?panels.findIndex(x=>x.P===hit):-1;
    target=idx!==from?idx:-1;
    panels.forEach((x,k)=>x.P.classList.toggle('drop',k===target));
  };
  const finish=(ev,apply)=>{
    document.removeEventListener('pointermove',place);document.removeEventListener('pointerup',up);document.removeEventListener('pointercancel',cancel);
    ghost.remove();badge.classList.remove('lifted');panels.forEach(x=>x.P.classList.remove('drop'));
    if(apply&&target>=0){record('tok');S[key]=target;buzz();update()}
  };
  const up=ev=>{place(ev);finish(ev,true)},cancel=ev=>finish(ev,false);
  document.addEventListener('pointermove',place);document.addEventListener('pointerup',up);document.addEventListener('pointercancel',cancel);
  place(e);
}
function adjust(i,d){
  record('life'+i);
  const p=S.players[i];p.life+=d;buzz();
  const x=panels[i];x.delta+=d;
  const dl=x.P.querySelector('.delta');dl.textContent=(x.delta>0?'+':'')+x.delta;dl.classList.add('show');
  clearTimeout(x.dt);x.dt=setTimeout(()=>{
    p.log.push({t:S.elapsed,d:x.delta,life:p.life,k:'life'});x.delta=0;dl.classList.remove('show');save()},1500);
  update();
}
function cmdrAdjust(i,k,d){
  const p=S.players[i],j=+k.slice(1),a=k[0]==='c'?p.cmdr:p.cmdrB;
  if(a[j]+d<0)return false;record('cmdr'+i+k);buzz();a[j]+=d;p.life-=d;logEvent(p,'cmdr dmg from '+S.players[j].name,-d,p.life);update();return true}
function logEvent(p,k,d,v){p.log.push({t:S.elapsed,d,life:v,k})}

/* player settings: a full-screen view, one player at a time (kept upright: it has text fields) */
let sheetFor=null;
function closeSheet(){document.querySelector('.sheet')?.remove();sheetFor=null}
function openSheet(i){
  const p=S.players[i];
  const old=document.querySelector('.sheet'),y0=old?old.scrollTop:0;   // re-renders keep the scroll position
  old?.remove();sheetFor=i;
  const sh=el('div','sheet full');
  const m=MODES[S.mode],n=S.players.length;
  let h=`<div class="head"><input value="${esc(p.name)}" maxlength="16" id="nm"><button class="close" id="cl">✕</button></div>`;
  h+='<h3>Commander</h3>';
  p.cmds.forEach((c,k)=>{h+=`<div class="cmd-cur"><img src="${esc(c.art)}" alt=""><span>${esc(c.name)}<br><small style="color:var(--muted)">art: ${esc(c.artist||'')}</small></span><button data-rm="${k}">Remove</button></div>`});
  if(p.cmds.length<2)h+=`<input class="cmd-search" id="cq" placeholder="${p.cmds.length?'Add partner / background…':'Search commander (Scryfall)…'}" autocomplete="off" autocapitalize="off"><div class="cmd-res" id="cres"></div>`;
  const ctr=(key,label,sub,val,lethal)=>`<div class="ctr${lethal?' lethal':''}"><div class="lbl">${label}<small>${sub}</small></div><div class="stepper"><button data-k="${key}" data-d="-1">−</button><span class="val">${val}</span><button data-k="${key}" data-d="1">+</button></div></div>`;
  if(m.cmdr){
    h+='<h3>Commander damage received</h3>';
    S.players.forEach((o,j)=>{
      const lbl=k=>`<span style="color:${colorOf(j)}">●</span> From ${j===i?'my own ':''}${esc(o.cmds[k]?o.cmds[k].name:o.name)}`,sub='lethal at 21 · also reduces life';
      h+=ctr('c'+j,lbl(0),sub,p.cmdr[j],p.cmdr[j]>=21);
      if(o.cmds.length>1)h+=ctr('d'+j,lbl(1),sub,p.cmdrB[j],p.cmdrB[j]>=21);
    });
  }
  h+='<h3>Panel color</h3><div class="sw">'+SWATCHES.map(c=>`<button data-c="${c}" class="${colorOf(i).toLowerCase()===c?'on':''}${takenBy(c,i)>=0?' taken':''}" style="background:${c}" title="${takenBy(c,i)>=0?'Used by '+esc(S.players[takenBy(c,i)].name):''}"></button>`).join('')+`<input type="color" id="cc" value="${colorOf(i)}" title="Custom color"><div class="note" id="cnote"></div></div>`;
  h+='<h3>Counters</h3>';
  h+=ctr('life','❤️ Life','',p.life,p.life<=0);
  h+=ctr('poison','☠ Poison','lethal at 10',p.poison,p.poison>=10);
  h+=ctr('energy','⚡ Energy','',p.energy);
  h+=ctr('exp','✨ Experience','',p.exp);
  h+='<h3>Tokens</h3><div class="toggles"><button id="tm" class="'+(S.monarch===i?'on':'')+'">👑 Monarch</button><button id="ti" class="'+(S.initiative===i?'on':'')+'">🏰 Initiative</button><button id="tb" class="'+(p.blessing?'on':'')+'">🏙️ City’s Blessing</button></div>';
  h+='<h3>Life log</h3><div class="log">'+
    (p.log.length?p.log.slice().reverse().slice(0,40).map(e=>`<div class="${e.d>0?'pos':'neg'}"><span>${fmt(e.t)} · ${e.k==='life'?'life':e.k}</span><span><b>${e.d>0?'+':''}${e.d}</b> → ${e.life}</span></div>`).join(''):'<div><span>No changes yet</span></div>')+'</div>';
  h+='<button class="sdone" id="dn">Done</button>';
  sh.innerHTML=h;document.body.append(sh);sh.scrollTop=y0;
  const nm=sh.querySelector('#nm'),defName='Player '+(i+1);
  nm.placeholder=defName;
  // first time naming: clear the default "Player #" so typing starts from an empty field
  nm.onfocus=()=>{if(p.name===defName){nm.value=''}};
  nm.oninput=()=>{p.name=nm.value.trim()?nm.value:defName;update()};
  const restore=()=>{if(!nm.value.trim()){p.name=defName;nm.value=defName}};
  nm.onblur=()=>{restore();update()};
  const closeIt=()=>{restore();closeSheet();update()};
  sh.querySelector('#cl').onclick=closeIt;sh.querySelector('#dn').onclick=closeIt;
  sh.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{p.cmds.splice(+b.dataset.rm,1);update();openSheet(i)});
  let ct;const cres=sh.querySelector('#cres');
  sh.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{const t=takenBy(b.dataset.c,i);if(t>=0){sh.querySelector('#cnote').textContent=S.players[t].name+' is already using that color.';return}p.color=b.dataset.c;update();openSheet(i)});
  sh.querySelector('#cc').oninput=e=>{const t=takenBy(e.target.value,i);if(t>=0){sh.querySelector('#cnote').textContent=S.players[t].name+' is already using that color.';return}sh.querySelector('#cnote').textContent='';p.color=e.target.value;update()};
  const cq=sh.querySelector('#cq');if(cq)cq.oninput=e=>{
    clearTimeout(ct);const q=e.target.value.trim();
    if(q.length<2){cres.innerHTML='';return}
    ct=setTimeout(async()=>{
      cres.innerHTML='<div class="hint">Searching…</div>';
      try{
        const r=await fetch('https://api.scryfall.com/cards/search?order=edhrec&q='+encodeURIComponent(p.cmds.length?q+` f:commander (o:partner or t:background or o:"friends forever" or o:"doctor's companion")`:q+' is:commander'));
        if(!r.ok){cres.innerHTML='<div class="hint">No commanders found.</div>';return}
        const cards=(await r.json()).data.filter(c=>!p.cmds.some(x=>x.name===c.name)).slice(0,6);
        cres.innerHTML='';
        cards.forEach(c=>{
          const img=(c.image_uris||(c.card_faces&&c.card_faces[0].image_uris)||{}).art_crop;if(!img)return;
          const b=el('button','','<img alt=""><span></span>');
          b.querySelector('img').src=img;b.querySelector('span').textContent=c.name;
          b.onclick=()=>{p.cmds.push({name:c.name,art:img,artist:c.artist||(c.card_faces&&c.card_faces[0].artist)||''});update();openSheet(i)};
          cres.append(b);
        });
      }catch(err){cres.innerHTML='<div class="hint">Could not reach Scryfall (offline?).</div>'}
    },350);
  };
  sh.querySelectorAll('.stepper button').forEach(b=>b.onclick=()=>{
    const k=b.dataset.k,d=+b.dataset.d;buzz();
    if(k==='life'){record('life'+i);p.life+=d;logEvent(p,'life',d,p.life)}
    else if(k[0]==='c'||k[0]==='d'){if(!cmdrAdjust(i,k,d))return}
    else{if(p[k]+d<0)return;record(k+i);p[k]+=d}
    update();openSheet(i);
  });
  sh.querySelector('#tm').onclick=()=>{record('tok');S.monarch=S.monarch===i?null:i;update();openSheet(i)};
  sh.querySelector('#ti').onclick=()=>{record('tok');S.initiative=S.initiative===i?null:i;update();openSheet(i)};
  sh.querySelector('#tb').onclick=()=>{record('tok');p.blessing=!p.blessing;update();openSheet(i)};
}

function makeSparkles(label,cls,big){
  const sp=el('div','sparkles '+cls);
  for(let k=0;k<28;k++){const e=el('span','',['✦','✧','✨','⋆'][k%4]);
    e.style.left=Math.random()*94+'%';e.style.top=Math.random()*90+'%';e.style.fontSize=(12+Math.random()*22)+'px';
    e.style.animationDelay=(Math.random()*1.2)+'s';e.style.animationDuration=(0.8+Math.random()*0.8)+'s';sp.append(e)}
  sp.append(el('div','first'+(big?' xl':''),label));return sp;
}
/* random first player: sweep clockwise for ~4s (decelerating), land on the pick, then 3s of sparkles */
let pickTimers=[];
function endPick(){
  pickTimers.forEach(clearTimeout);pickTimers=[];
  panels.forEach(x=>{x.P.classList.remove('hl','win');x.P.querySelector('.sparkles.pick')?.remove()});
  $('app').classList.remove('picking');$('pickguard').style.display='none';
}
function pickRandomPlayer(){
  endPick();
  const n=S.players.length,topN=Math.floor(n/2);
  const order=[];for(let k=0;k<topN;k++)order.push(k);for(let k=n-1;k>=topN;k--)order.push(k);  // clockwise on screen: top row L→R, bottom row R→L
  const w=Math.floor(Math.random()*n),pw=order.indexOf(w),start=Math.floor(Math.random()*n);
  const m=n*3+((pw-start+n)%n);  // number of steps so the sweep ends on the winner
  $('app').classList.add('picking');$('pickguard').style.display='block';
  let prev=null;
  for(let i=0;i<=m;i++){
    const t=4000*(1-Math.pow(1-i/m,2));  // fast at first, slowing toward the end
    pickTimers.push(setTimeout(()=>{
      if(prev!=null)panels[order[prev]].P.classList.remove('hl');
      const idx=(start+i)%n;panels[order[idx]].P.classList.add('hl');prev=idx;buzz();
    },t));
  }
  pickTimers.push(setTimeout(()=>{
    const P=panels[w].P;P.classList.remove('hl');P.classList.add('win');
    pcOf(P).append(makeSparkles('goes first','pick'));buzz();
  },4000+120));
  pickTimers.push(setTimeout(endPick,4000+120+3000));
}
$('pickguard').onclick=endPick;
/* game summary: life total after every life event, drawn to a PNG (shown as an <img> so iOS long-press Save also works) */
function drawSummary(cv,W){
  const n=S.players.length,u=W/360,H=Math.round((364+28*n)*u);cv.width=W;cv.height=H;
  const c=cv.getContext('2d'),F=(sz,w)=>`${w||500} ${sz*u}px -apple-system,"Segoe UI",system-ui,sans-serif`;
  c.fillStyle='#0f1115';c.fillRect(0,0,W,H);c.textBaseline='alphabetic';c.textAlign='left';
  const alive=S.players.map((q,i)=>i).filter(i=>!dead(S.players[i])),win=n>1&&alive.length===1?alive[0]:null;
  c.fillStyle='#f3f4f6';c.font=F(20,800);c.fillText('Game summary',16*u,32*u);
  c.fillStyle='#9aa0ab';c.font=F(11);c.fillText(`${MODES[S.mode].label} · ${n} players · ${fmt(S.elapsed)} · ${new Date().toLocaleDateString()}`,16*u,50*u);
  c.font=F(15,800);c.fillStyle=win!=null?'#fbbf24':'#9aa0ab';
  c.fillText(win!=null?`🏆 ${S.players[win].name} wins`:(alive.length===0?'Draw — nobody left standing':'Game in progress'),16*u,76*u);
  c.font=F(13,700);c.fillStyle='#f3f4f6';c.fillText('Life Totals',16*u,100*u);
  const start=MODES[S.mode].life,now=S.elapsed;
  const series=S.players.map(q=>{
    const end=dead(q)&&q.defeatT!=null?q.defeatT:null,pts=[[0,start]];
    q.log.slice().sort((a,b)=>a.t-b.t).filter(e=>end==null||e.t<=end).forEach(e=>pts.push([e.t,Math.max(0,e.life)]));
    const last=pts[pts.length-1];
    if(end!=null)pts.push([Math.max(end,last[0]),q.defeat&&q.defeat.type==='life'?0:last[1]]);   // stops at the moment they were eliminated
    else{
      pts.push([Math.max(now,last[0]),Math.max(0,q.life)]);
      if(q.life<=0){let k=pts.length-1;while(k>0&&pts[k-1][1]<=0)k--;pts.length=k+1}   // older games without a recorded time
    }
    return pts});
  const all=series.flat(),tmax=Math.max(1,...all.map(a=>a[0]));
  let lo=0,hi=Math.max(start,...all.map(a=>a[1]));const pad=Math.max(2,hi*.05);lo=-pad*.6;hi+=pad;
  const L=44*u,R=W-16*u,T=116*u,B=318*u,X=t=>L+(R-L)*t/tmax,Y=v=>B-(B-T)*(v-lo)/(hi-lo);
  const step=[1,2,5,10,20,50,100,200].find(st=>(hi-lo)/st<=6)||500;
  c.font=F(10);c.textAlign='right';c.lineWidth=1*u;
  for(let v=Math.ceil(lo/step)*step;v<=hi;v+=step){c.strokeStyle='rgba(255,255,255,.08)';c.beginPath();c.moveTo(L,Y(v));c.lineTo(R,Y(v));c.stroke();c.fillStyle='#9aa0ab';c.fillText(v,L-6*u,Y(v)+3.5*u)}
  c.strokeStyle='rgba(239,68,68,.85)';c.setLineDash([5*u,4*u]);c.beginPath();c.moveTo(L,Y(0));c.lineTo(R,Y(0));c.stroke();c.setLineDash([]);
  c.textAlign='center';c.fillStyle='#9aa0ab';for(let k=0;k<=4;k++)c.fillText(fmt(Math.round(tmax*k/4)),X(tmax*k/4),B+15*u);
  c.lineJoin='round';
  series.forEach((pts,i)=>{
    const col=colorOf(i),path=()=>{c.beginPath();c.moveTo(X(pts[0][0]),Y(pts[0][1]));for(let k=1;k<pts.length;k++){c.lineTo(X(pts[k][0]),Y(pts[k-1][1]));c.lineTo(X(pts[k][0]),Y(pts[k][1]))}};
    path();c.strokeStyle='rgba(255,255,255,.3)';c.lineWidth=5*u;c.stroke();   // light underlay keeps dark colors visible
    path();c.strokeStyle=col;c.lineWidth=2.8*u;c.stroke();
    for(let k=1;k<pts.length-1;k++){c.beginPath();c.arc(X(pts[k][0]),Y(pts[k][1]),2.6*u,0,7);c.fillStyle=col;c.fill();c.lineWidth=1*u;c.strokeStyle='#0f1115';c.stroke()}
    const e=pts[pts.length-1],ex=X(e[0]),ey=Y(e[1]);
    if(dead(S.players[i])){c.strokeStyle='#fff';c.lineWidth=2.6*u;c.beginPath();c.moveTo(ex-4*u,ey-4*u);c.lineTo(ex+4*u,ey+4*u);c.moveTo(ex+4*u,ey-4*u);c.lineTo(ex-4*u,ey+4*u);c.stroke()}
    else{c.beginPath();c.arc(ex,ey,4.4*u,0,7);c.fillStyle=col;c.fill();c.lineWidth=2*u;c.strokeStyle='#fff';c.stroke()}
  });
  c.textAlign='left';
  S.players.forEach((q,i)=>{
    const y=B+34*u+i*28*u;
    c.beginPath();c.arc(22*u,y+7*u,6*u,0,7);c.fillStyle=colorOf(i);c.fill();c.lineWidth=1.5*u;c.strokeStyle='rgba(255,255,255,.7)';c.stroke();
    c.fillStyle='#f3f4f6';c.font=F(13,700);c.fillText(q.name,36*u,y+10*u);
    const d=q.defeat,out=i===win?'Winner!':!d?'':d.type==='life'?'Defeated':d.type==='poison'?'Poisoned':`Defeated by ${d.by}!`;
    let sub=[q.cmds.map(x=>x.name).join(' & '),out&&d&&i!==win&&q.defeatT!=null?`${out} at ${fmt(q.defeatT)}`:out].filter(Boolean).join(' · ');
    c.font=F(10);c.fillStyle='#9aa0ab';const maxW=W-16*u-70*u-36*u;
    while(sub&&c.measureText(sub).width>maxW)sub=sub.slice(0,-2)+'…';
    c.fillText(sub,36*u,y+22*u);
    c.textAlign='right';c.font=F(17,800);c.fillStyle=dead(q)?'#9aa0ab':'#f3f4f6';c.fillText(Math.max(0,q.life),W-16*u,y+14*u);c.textAlign='left';
  });
}

const bar=$('bar'),BPOS='mtg-bar-pos2';   // v2: saved only when you move the bar yourself; the default is the bottom edge
const probe=el('div');probe.style.cssText='position:fixed;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)';document.body.append(probe);
function computeRot(){
  const q=new URLSearchParams(location.search).get('angle');   // ?angle=90 / -90 forces a turn (for testing)
  let a;
  if(q!==null)a=+q;
  else{
    if(innerWidth<=innerHeight)return 0;   // upright
    a=typeof window.orientation==='number'?window.orientation:((screen.orientation&&screen.orientation.angle)||0);
  }
  a=((a%360)+360)%360;
  return a===90?-90:a===270?90:0;   // turn the board opposite to the phone so it stays fixed to the phone
}
function applyRotation(){
  ROT=computeRot();const stage=$('stage');
  document.body.classList.toggle('rot',ROT!==0);
  if(ROT===0)stage.style.cssText='';
  else{
    const E=k=>`env(safe-area-inset-${k})`,m=ROT===90?{t:'right',r:'bottom',b:'left',l:'top'}:{t:'left',r:'top',b:'right',l:'bottom'};
    stage.style.cssText=`inset:auto;left:50%;top:50%;width:${innerHeight}px;height:${innerWidth}px;transform:translate(-50%,-50%) rotate(${ROT}deg);--it:${E(m.t)};--ir:${E(m.r)};--ib:${E(m.b)};--il:${E(m.l)};--cr:${-ROT}deg`;
  }
  panels.forEach(x=>layoutPC(x.P));
}
function layoutPC(P){
  const pc=P.querySelector(':scope>.pc');if(!pc)return;
  if(ROT===0){pc.style.cssText='';delete P.dataset.theta;if(P.dataset.crownN)P.dataset.crown=P.dataset.crownN;return}
  // Turned phone: face each panel's text toward the nearest outside edge of the phone (as the viewer sees it).
  const pr=P.getBoundingClientRect(),cx=pr.left+pr.width/2,cy=pr.top+pr.height/2;
  // Distances are measured to the edges of the area the panels actually occupy (not the raw screen), so uneven safe-area
  // margins (home bar, notch) and the docked bar can't break a tie. Near-ties prefer top/bottom (players across from each
  // other); top vs bottom is then settled by seat (top row of the board = top).
  const rs=panels.map(x=>x.P.getBoundingClientRect()),minL=Math.min(...rs.map(r=>r.left)),maxR=Math.max(...rs.map(r=>r.right)),minT=Math.min(...rs.map(r=>r.top)),maxB=Math.max(...rs.map(r=>r.bottom));
  const bias=3,dT=cy-minT,dB=maxB-cy,d={top:dT-bias,bottom:dB-bias,left:cx-minL,right:maxR-cx};
  let edge=Object.keys(d).reduce((a,k)=>d[k]<d[a]?k:a,'bottom');
  if((edge==='top'||edge==='bottom')&&Math.abs(dT-dB)<4)edge=P.dataset.top==='1'?'top':'bottom';
  const theta={bottom:0,top:180,left:90,right:-90}[edge];   // net turn of the content as the viewer sees it
  P.dataset.theta=theta;
  const rho=theta-ROT,quarter=Math.abs(Math.round(rho/90))%2===1;
  const w0=P.clientWidth,h0=P.clientHeight,cw=quarter?h0:w0,ch=quarter?w0:h0;
  pc.style.width=cw+'px';pc.style.height=ch+'px';pc.style.transform=`translate(-50%,-50%) rotate(${rho}deg)`;
  // crown / tokens: whichever top corner of the (turned) content is nearer the middle of the board
  const sx=(minL+maxR)/2,sy=(minT+maxB)/2,t=theta*Math.PI/180,c=Math.cos(t),sn=Math.sin(t);
  const corner=lx=>[cx+lx*c-(-ch/2)*sn,cy+lx*sn+(-ch/2)*c];
  const L=corner(-cw/2),R=corner(cw/2);
  P.dataset.crown=Math.hypot(L[0]-sx,L[1]-sy)<Math.hypot(R[0]-sx,R[1]-sy)-1?'left':'right';
}
const faceAngle=i=>{const t=panels[i]&&panels[i].P.dataset.theta;return t!==undefined?+t:(i<Math.floor(S.players.length/2)?180:0)};
function toBoard(cx,cy){   // viewport point -> board (stage) coordinates
  const st=$('stage'),r=st.getBoundingClientRect(),vx=cx-(r.left+r.width/2),vy=cy-(r.top+r.height/2),t=ROT*Math.PI/180,c=Math.cos(t),sn=Math.sin(t);
  return [st.offsetWidth/2+vx*c+vy*sn,st.offsetHeight/2-vx*sn+vy*c];
}
applyRotation();
const orient=()=>{const st=$('stage');return st.offsetWidth<=st.offsetHeight?'h':'v'};
const barO=()=>S.barO||(S.barO=orient());   // fixed for the game: set at new game / first load, not on rotation  // h: bar docks along the top/bottom (short edges of a portrait screen)
function placeBar(pos,animate){
  bar.dataset.pos=pos;bar.dataset.o=barO();bar.classList.toggle('snap',!!animate&&pos==='center');
  if(pos==='center'){bar.style.left='50%';bar.style.top='50%'}else{bar.style.left='';bar.style.top=''}
  const v=bar.dataset.o==='v',sz=pos==='center'?0:(v?bar.offsetWidth:bar.offsetHeight),st=pos==='start',en=pos==='end',a=$('app').style;
  a.setProperty('--dockT',st&&!v?sz+'px':'0px');a.setProperty('--dockB',en&&!v?sz+'px':'0px');
  a.setProperty('--dockL',st&&v?sz+'px':'0px');a.setProperty('--dockR',en&&v?sz+'px':'0px');
}
function nearestPos(x,y){
  const st=$('stage'),v=barO()==='v',n=v?x:y,L=v?st.offsetWidth:st.offsetHeight,t={center:L/2,start:0,end:L};
  return Object.keys(t).reduce((b,k)=>Math.abs(n-t[k])<Math.abs(n-t[b])?k:b,'center');
}
[$('grip'),$('timer')].forEach(h=>{
  let down=false,dx=0,dy=0;
  h.addEventListener('pointerdown',e=>{down=true;h.setPointerCapture(e.pointerId);
    const r=bar.getBoundingClientRect(),f=bar.dataset.pos==='center',[px,py]=toBoard(e.clientX,e.clientY),[bx,by]=toBoard(r.left+r.width/2,r.top+r.height/2);dx=f?px-bx:0;dy=f?py-by:0;
    bar.classList.remove('snap');bar.classList.add('drag')});
  h.addEventListener('pointermove',e=>{if(!down)return;const [px,py]=toBoard(e.clientX,e.clientY);bar.style.left=(px-dx)+'px';bar.style.top=(py-dy)+'px'});
  const end=e=>{if(!down)return;down=false;bar.classList.remove('drag');
    const [px,py]=toBoard(e.clientX,e.clientY),pos=nearestPos(px,py);try{localStorage.setItem(BPOS,pos)}catch(err){}bar.style.left='';bar.style.top='';placeBar(pos,false);
    // re-measure after layout flips between horizontal/vertical
    requestAnimationFrame(()=>placeBar(pos,false));buzz()};
  h.addEventListener('pointerup',end);h.addEventListener('pointercancel',end);
});
const refit=()=>{applyRotation();placeBar(bar.dataset.pos,false)};
addEventListener('resize',refit);
addEventListener('orientationchange',()=>{refit();setTimeout(refit,250)});
(()=>{let pos='end';try{pos=localStorage.getItem(BPOS)||'end'}catch(e){}if(!['center','start','end'].includes(pos))pos='end';placeBar(pos,false);requestAnimationFrame(()=>placeBar(pos,false))})();

setInterval(()=>{if(!S.paused&&!gameIsOver){S.elapsed++;if(S.elapsed%5===0)save()}$('timer').textContent=fmt(S.elapsed)},1000);

/* keep screen awake */
let lock=null;
async function wake(){try{lock=await navigator.wakeLock.request('screen')}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')wake()});
document.addEventListener('pointerdown',()=>{if(!lock)wake()},{once:true});

if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
$('bPause').textContent=S.paused?'▶️':'⏸';$('timer').textContent=fmt(S.elapsed);
render();
</script>
</body>
